<script>
const params = new URLSearchParams(location.search);
const token = params.get("token");

const API = "https://gadgets-ralph-synthesis-layout.trycloudflare.com";
const BOT = "Flash_File_Share_bot";

const button = document.getElementById("watch");
const statusEl = document.getElementById("status");
const stateEl = document.getElementById("state");

let checking = false;

if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
}

function status(text){
    statusEl.innerText = text;
}

async function checkUnlock(){
    if(!token) return false;

    try{
        const r = await fetch(
            API + "/unlock/status?token=" + encodeURIComponent(token),
            {cache:"no-store"}
        );

        if(!r.ok) return false;

        const data = await r.json();

        if(data.ok && data.unlocked && !data.used){
            stateEl.innerText = "✅ Unlocked";
            status("✅ Advertisement verified! File opening...");
            return true;
        }

    }catch(e){
        console.log("Unlock status check failed:", e);
    }

    return false;
}

async function waitForVerification(){

    if(checking) return;

    checking = true;

    stateEl.innerText = "⏳ Verifying";
    status("⏳ Verifying your advertisement...");

    for(let i=0;i<30;i++){

        if(await checkUnlock()){

            checking = false;

            stateEl.innerText = "✅ Unlocked";
            status("🎉 Advertisement verified! Click GET FILE to continue.");

            button.disabled = false;
            button.innerText = "✅ GET FILE";
            button.onclick = () => {

                window.location.href =
                    "https://t.me/" + BOT + "?start=unlock_" +
                    encodeURIComponent(token);

            };

            return;
        }

        await new Promise(r=>setTimeout(r,2000));
    }

    checking = false;

    stateEl.innerText = "⚠️ Pending";
    status("⚠️ Verification is taking a little longer. Please try again.");

    button.disabled = false;
}

async function watchAd(){

    if(!token){

        status("❌ Invalid unlock session.");
        button.disabled = true;

        return;
    }

    button.disabled = true;

    stateEl.innerText = "📺 Ad";
    status("⏳ Advertisement loading...");

    try{

        await show_11773161({
            ymid: token
        });

        status("✅ Advertisement completed. Verification waiting...");

        await waitForVerification();

    }catch(error){

        console.log("Monetag error:", error);

        stateEl.innerText = "🔒 Locked";

        status("❌ Advertisement complete nahi hua. Please try again.");

        button.disabled = false;
    }
}

if(!token){

    stateEl.innerText = "❌ Invalid";
    status("Invalid unlock link.");
    button.disabled = true;
}
