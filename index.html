<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flash File Share • Unlock</title>

<!-- MONETAG: DO NOT CHANGE -->
<script src="https://libtl.com/sdk.js" data-zone="11773161" data-sdk="show_11773161"></script>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;font-family:Arial,sans-serif;
 background:linear-gradient(145deg,#080b18,#111936 55%,#07111f);
 color:#fff;display:flex;align-items:center;justify-content:center;padding:20px
}
.card{
 width:100%;max-width:430px;padding:30px 22px;border-radius:28px;
 background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
 box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:center;
 backdrop-filter:blur(18px)
}
.logo{
 width:76px;height:76px;margin:0 auto 18px;border-radius:22px;
 display:flex;align-items:center;justify-content:center;font-size:38px;
 background:linear-gradient(135deg,#6d5dfc,#24c8ff);
 box-shadow:0 12px 35px rgba(36,200,255,.25)
}
h1{font-size:24px;margin:8px 0}
.sub{color:#aeb7d0;font-size:14px;line-height:1.6}
.info{
 margin:22px 0;padding:16px;border-radius:18px;
 background:rgba(255,255,255,.06);text-align:left
}
.row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.label{color:#9da8c3}.value{font-weight:bold}
button{
 width:100%;border:0;border-radius:16px;padding:16px;
 font-size:16px;font-weight:bold;color:#fff;
 background:linear-gradient(135deg,#6d5dfc,#19bfff);
 box-shadow:0 10px 28px rgba(36,180,255,.25)
}
button:disabled{opacity:.55}
#status{margin-top:18px;font-size:14px;line-height:1.5;color:#cbd3e8}
.small{margin-top:18px;font-size:11px;color:#737e99}
</style>
</head>

<body>
<div class="card">
  <div class="logo">🔐</div>
  <h1>Secure File Unlock</h1>
  <div class="sub">
    Advertisement complete karein aur aapki file unlock ho jayegi.
  </div>

  <div class="info">
    <div class="row">
      <span class="label">Status</span>
      <span class="value" id="state">🔒 Locked</span>
    </div>
    <div class="row">
      <span class="label">Protection</span>
      <span class="value">🛡️ Secure</span>
    </div>
  </div>

  <button id="watch" onclick="watchAd()">📺 Watch Ad & Unlock</button>

  <div id="status">Advertisement start karne ke liye button dabayein.</div>
  <div class="small">Flash File Share • Secure Delivery</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get("token");

const API = "https://gadgets-ralph-synthesis-layout.trycloudflare.com";
const BOT = "Flash_File_Share_bot";

const button = document.getElementById("watch");
const statusEl = document.getElementById("status");
const stateEl = document.getElementById("state");

let checking = false;

if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
}

function status(text){
    statusEl.innerText = text;
}

async function checkUnlock(){
    if(!token) return false;

    try{
        const r = await fetch(
            API + "/unlock/status?token=" + encodeURIComponent(token),
            {cache:"no-store"}
        );

        if(!r.ok) return false;

        const data = await r.json();

        if(data.ok && data.unlocked && !data.used){
            stateEl.innerText = "✅ Unlocked";
            status("✅ Advertisement verified! File opening...");
            return true;
        }
    }catch(e){
        console.log("Unlock status check failed:", e);
    }

    return false;
}

async function waitForVerification(){
    if(checking) return;

    checking = true;
    stateEl.innerText = "⏳ Verifying";
    status("⏳ Advertisement verify ho raha hai...");

    for(let i=0;i<30;i++){
        if(await checkUnlock()){
            setTimeout(() => {
                window.location.href =
                    "https://t.me/" + BOT + "?start=unlock_" +
                    encodeURIComponent(token);
            },1000);
            return;
        }

        await new Promise(r=>setTimeout(r,2000));
    }

    checking = false;
    stateEl.innerText = "⚠️ Pending";
    status("⚠️ Verification mein thoda time lag raha hai. Dobara check karein.");
    button.disabled = false;
}

async function watchAd(){
    if(!token){
        status("❌ Invalid unlock session.");
        button.disabled = true;
        return;
    }

    button.disabled = true;
    stateEl.innerText = "📺 Ad";
    status("⏳ Advertisement loading...");

    try{
        await show_11773161({
            ymid: token
        });

        status("✅ Advertisement completed. Verification waiting...");
        await waitForVerification();

    }catch(error){
        console.log("Monetag error:", error);
        stateEl.innerText = "🔒 Locked";
        status("❌ Advertisement complete nahi hua. Please try again.");
        button.disabled = false;
    }
}

if(!token){
    stateEl.innerText = "❌ Invalid";
    status("Invalid unlock link.");
    button.disabled = true;
}
</script>
</body>
</html>
