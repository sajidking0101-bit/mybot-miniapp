<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flash File Share • Unlock</title>

<!-- MONETAG: DO NOT CHANGE -->
<script src="https://libtl.com/sdk.js" data-zone="11773161" data-sdk="show_11773161"></script>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at 15% 10%,rgba(0,145,255,.30),transparent 35%),
        radial-gradient(circle at 90% 90%,rgba(0,80,220,.28),transparent 40%),
        linear-gradient(145deg,#020b1c,#062b5c 52%,#03152f);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.card{
    width:100%;
    max-width:430px;
    padding:28px 20px 24px;
    border-radius:28px;
    background:rgba(5,30,65,.82);
    border:1px solid rgba(95,190,255,.25);
    box-shadow:0 25px 70px rgba(0,0,0,.55);
    backdrop-filter:blur(20px);
}

.logo{
    width:76px;
    height:76px;
    margin:0 auto 16px;
    border-radius:23px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    background:linear-gradient(145deg,#168cff,#0057d9);
    box-shadow:0 12px 32px rgba(0,130,255,.35);
}

.badge{
    width:max-content;
    margin:0 auto 9px;
    padding:6px 12px;
    border-radius:20px;
    background:rgba(0,160,255,.12);
    border:1px solid rgba(80,190,255,.22);
    color:#74d2ff;
    font-size:11px;
    font-weight:bold;
    letter-spacing:.7px;
}

h1{
    text-align:center;
    font-size:25px;
    margin:6px 0 7px;
}

.sub{
    text-align:center;
    color:#b8cbe5;
    font-size:13px;
    line-height:1.5;
}

/* STEPS */
.steps{
    display:flex;
    align-items:center;
    margin:25px 4px 22px;
}

.step{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:58px;
}

.circle{
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    color:#7892b0;
    font-weight:bold;
}

.step.active .circle{
    background:linear-gradient(135deg,#0799ff,#075bd8);
    border-color:#42b4ff;
    color:#fff;
    box-shadow:0 7px 20px rgba(0,130,255,.3);
}

.step.done .circle{
    background:#087bcb;
    border-color:#55c5ff;
    color:#fff;
}

.step span{
    margin-top:7px;
    font-size:10px;
    color:#7892b0;
}

.step.active span,
.step.done span{
    color:#dff5ff;
}

.line{
    height:2px;
    flex:1;
    margin:0 5px;
    margin-bottom:20px;
    background:rgba(255,255,255,.12);
}

.line.done{
    background:#168cff;
}

/* INFO */
.info{
    padding:14px 15px;
    border-radius:18px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.08);
    margin-bottom:17px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    font-size:13px;
}

.row + .row{
    border-top:1px solid rgba(255,255,255,.06);
}

.label{
    color:#8fa9c8;
}

.value{
    font-weight:bold;
    color:#eaf6ff;
}

/* BUTTON */
button{
    width:100%;
    border:0;
    border-radius:17px;
    padding:17px;
    font-size:16px;
    font-weight:bold;
    color:#fff;
    background:linear-gradient(135deg,#0799ff,#075bd8);
    box-shadow:0 12px 30px rgba(0,130,255,.30);
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

#verify,
#getFile{
    display:none;
}

#status{
    margin-top:15px;
    min-height:22px;
    text-align:center;
    font-size:13px;
    line-height:1.5;
    color:#c5d9ef;
}

.small{
    margin-top:19px;
    text-align:center;
    font-size:10px;
    color:#6683a5;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">🔐</div>

    <div class="badge">SECURE FILE ACCESS</div>

    <h1>Unlock Your File</h1>

    <div class="sub">
        Complete the steps below to access your requested file.
    </div>

    <!-- STEPS -->
    <div class="steps">

        <div class="step active" id="step1">
            <div class="circle">1</div>
            <span>WATCH</span>
        </div>

        <div class="line" id="line1"></div>

        <div class="step" id="step2">
            <div class="circle">2</div>
            <span>VERIFY</span>
        </div>

        <div class="line" id="line2"></div>

        <div class="step" id="step3">
            <div class="circle">3</div>
            <span>DONE</span>
        </div>

    </div>

    <div class="info">

        <div class="row">
            <span class="label">Access Status</span>
            <span class="value" id="state">🔒 Locked</span>
        </div>

        <div class="row">
            <span class="label">Security</span>
            <span class="value">🛡️ Protected</span>
        </div>

    </div>

    <!-- WATCH BUTTON -->
    <button id="watch" onclick="watchAd()">
        📺 Watch Ad & Unlock
    </button>

    <!-- VERIFY BUTTON -->
    <button id="verify" onclick="verifyUnlock()">
        ✅ VERIFY
    </button>

    <!-- GET FILE BUTTON -->
    <button id="getFile" onclick="getFile()">
        📁 GET FILE
    </button>

    <div id="status">
        Tap the button above to start.
    </div>

    <div class="small">
        Flash File Share • Secure Delivery
    </div>

</div>

<script>

const params = new URLSearchParams(location.search);
const token = params.get("token");

const API = "https://birmingham-welfare-lobby-calm.trycloudflare.com";
const BOT = "Flash_File_Share_bot";

const button = document.getElementById("watch");
const verifyButton = document.getElementById("verify");
const getFileButton = document.getElementById("getFile");

const statusEl = document.getElementById("status");
const stateEl = document.getElementById("state");

const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const step3 = document.getElementById("step3");

const line1 = document.getElementById("line1");
const line2 = document.getElementById("line2");

let checking = false;

if(window.Telegram && window.Telegram.WebApp){
    window.Telegram.WebApp.ready();
}

function status(text){
    statusEl.innerText = text;
}

function setStep(step){

    step1.classList.remove("active","done");
    step2.classList.remove("active","done");
    step3.classList.remove("active","done");

    line1.classList.remove("done");
    line2.classList.remove("done");

    if(step === 1){

        step1.classList.add("active");

    }

    if(step === 2){

        step1.classList.add("done");
        step2.classList.add("active");
        line1.classList.add("done");

    }

    if(step === 3){

        step1.classList.add("done");
        step2.classList.add("done");
        step3.classList.add("active","done");

        line1.classList.add("done");
        line2.classList.add("done");

    }
}

async function checkUnlock(){

    if(!token) return false;

    try{

        const r = await fetch(
            API + "/unlock/status?token=" +
            encodeURIComponent(token),
            {cache:"no-store"}
        );

        if(!r.ok) return false;

        const data = await r.json();

        if(data.ok && data.unlocked && !data.used){

            return true;

        }

    }catch(e){

        console.log("Unlock status check failed:",e);

    }

    return false;
}

/* VERIFY BUTTON */
async function verifyUnlock(){

    if(!token) return;

    if(checking) return;

    checking = true;

    verifyButton.disabled = true;

    setStep(2);

    stateEl.innerText = "⏳ Verifying";

    status("⏳ Checking advertisement verification...");

    for(let i = 0; i < 15; i++){

        if(await checkUnlock()){

            checking = false;

            setStep(3);

            stateEl.innerText = "✅ Unlocked";

            status(
                "🎉 Verification successful! " +
                "Your file is ready."
            );

            verifyButton.style.display = "none";

            getFileButton.style.display = "block";

            return;
        }

        await new Promise(
            r => setTimeout(r,2000)
        );
    }

    checking = false;

    verifyButton.disabled = false;

    stateEl.innerText = "⚠️ Pending";

    status(
        "⚠️ Verification pending. " +
        "Please tap VERIFY again."
    );

}

/* WATCH AD */
async function watchAd(){

    if(!token){

        status("❌ Invalid unlock session.");

        button.disabled = true;

        return;
    }

    button.disabled = true;

    setStep(1);

    stateEl.innerText = "📺 Ad";

    status("⏳ Advertisement loading...");

    try{

        /*
         * MONETAG CALL
         * DO NOT CHANGE
         */
        await show_11773161({
            ymid: token
        });

        /*
         * AD COMPLETE
         * NOW SHOW VERIFY BUTTON
         */

        button.style.display = "none";

        verifyButton.style.display = "block";

        setStep(2);

        stateEl.innerText = "⏳ Waiting";

        status(
            "✅ Advertisement completed.\n" +
            "👇 Now tap VERIFY."
        );

    }catch(error){

        console.log("Monetag error:",error);

        stateEl.innerText = "🔒 Locked";

        status(
            "❌ Advertisement complete nahi hua. " +
            "Please try again."
        );

        button.disabled = false;
    }
}

/* GET FILE */
function getFile(){

    if(!token) return;

    window.location.href =
        "https://t.me/" +
        BOT +
        "?start=unlock_" +
        encodeURIComponent(token);
}

if(!token){

    stateEl.innerText = "❌ Invalid";

    status("Invalid unlock link.");

    button.disabled = true;
}

</script>

</body>
</html>
